[package]
name = "bui"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for git branch operations"
repository = "https://github.com/RyotaSugawara/bui"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["git", "tui", "branch", "ratatui", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
